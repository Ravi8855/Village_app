# Push to main → test → bump version → build signed AAB → upload to Google Play.
# Installed Play builds auto-prompt via in_app_update (AppUpdateHost in lib/app.dart).
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_PLAY_SERVICE_ACCOUNT
# Optional: MAPS_API_KEY, ADMIN_EMAIL, PLAY_TRACK (default: internal)
#
# Play Console: testers must install from the same track CI publishes to.

name: Deploy Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip redeploy when only the automated version-bump commit was pushed.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create dart_defines.json
        run: |
          cat > dart_defines.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "ADMIN_EMAIL": "${{ secrets.ADMIN_EMAIL || 'ravichalmar@gmail.com' }}",
            "MAPS_API_KEY": "${{ secrets.MAPS_API_KEY }}"
          }
          EOF

      - name: Bump Android build number
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          NEW_VERSION="${BASE_VERSION}+${{ github.run_number }}"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          grep '^version:' pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Prepare Play Store release notes
        run: |
          mkdir -p whatsnew/whatsnew-en-US
          MSG="${{ github.event.head_commit.message }}"
          if [ -z "$MSG" ]; then
            MSG="Bug fixes and improvements."
          fi
          printf '%s' "$MSG" | head -c 480 > whatsnew/whatsnew-en-US/whatsnew-en-US.txt

      - name: Build App Bundle
        run: flutter build appbundle --release --dart-define-from-file=dart_defines.json

      - name: Build APK (artifact for sideload testing)
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ steps.version.outputs.new_version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play-action@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.naganoor.village_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          whatsNewDirectory: whatsnew

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          if git diff --staged --quiet; then
            echo "No pubspec changes to commit."
            exit 0
          fi
          git commit -m "chore: release Android ${{ steps.version.outputs.new_version }} [skip ci]"
          git push
