# Builds a signed Android App Bundle and uploads to Google Play on every push to main.
# Installed apps pick up the new version through the existing in_app_update flow.
#
# One-time repo setup (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   MAPS_API_KEY                  (optional)
#   ADMIN_EMAIL                   (optional)
#   ANDROID_KEYSTORE_BASE64       (base64-encoded .jks / keystore file)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_PLAY_SERVICE_ACCOUNT   (JSON service account with Play Console API access)
#
# Play Console: create an internal-testing release track; the workflow publishes there.

name: Deploy Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create dart_defines.json
        run: |
          cat > dart_defines.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "ADMIN_EMAIL": "${{ secrets.ADMIN_EMAIL || 'ravichalmar@gmail.com' }}",
            "MAPS_API_KEY": "${{ secrets.MAPS_API_KEY }}"
          }
          EOF

      - name: Bump Android build number
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          sed -i "s/^version: .*/version: ${BASE_VERSION}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle
        run: |
          flutter pub get
          flutter build appbundle --release --dart-define-from-file=dart_defines.json

      - name: Upload to Google Play (internal)
        uses: r0adkll/upload-google-play-action@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.naganoor.village_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
