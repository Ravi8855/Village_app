name: naganoor_village_app
description: Naganoor Village App — community dashboard, news, weather, and health.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.9.0
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  equatable: ^2.0.5
  in_app_update: ^4.2.5
  package_info_plus: ^10.1.0
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.6
  restart_app: ^1.8.3
  image_picker: ^1.1.2
  device_info_plus: ^13.1.0
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0B5D3B"
  adaptive_icon_foreground: assets/icon/app_icon.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#0B5D3B"
    theme_color: "#1B5E20"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - shorebird.yaml
